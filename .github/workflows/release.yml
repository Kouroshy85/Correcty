name: Build Correcty release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: correcty-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: '1.0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check whether this version is published
        id: existing
        shell: pwsh
        run: |
          gh release view "v$env:VERSION" *> $null
          if ($LASTEXITCODE -eq 0) {
            "published=true" >> $env:GITHUB_OUTPUT
          } else {
            "published=false" >> $env:GITHUB_OUTPUT
          }
          exit 0
      - name: Install build dependencies
        if: steps.existing.outputs.published != 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        if: steps.existing.outputs.published != 'true'
        run: python -m unittest discover -s tests -v
      - name: Build Windows app
        if: steps.existing.outputs.published != 'true'
        run: python -m PyInstaller --noconfirm --clean Correcty.spec
      - name: Build installer and publish release
        if: steps.existing.outputs.published != 'true'
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          & $compiler installer/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $asset = "installer/Output/Correcty-Setup-$env:VERSION.exe"
          $digest = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  Correcty-Setup-$env:VERSION.exe" | Set-Content -Encoding ascii SHA256SUMS.txt
          $notes = @'
          Correcty provides local message templates and AI text polishing, with English and Persian interfaces.

          Download the Windows installer below. Python is not required. AI polishing optionally uses a separately installed local Ollama model.

          This release includes generic examples and a general writing prompt. It uses its own data folder, installer identity, and port (5056).

          Source code: MIT license. Bundled Vazirmatn font: SIL Open Font License 1.1. The installer is unsigned.
          '@
          $notes | Set-Content release-notes.md -Encoding utf8
          gh release create "v$env:VERSION" $asset SHA256SUMS.txt --target '${{ github.sha }}' --title "Correcty $env:VERSION" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
